name: Spanish Site Build QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/**'
      - 'data/**'
      - 'content/articles/**'
      - '.github/workflows/site-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated pages and SEO
        run: |
          node --check scripts/build.mjs
          node --check scripts/factory.mjs
          node --check scripts/qa-factory.mjs
          node scripts/build.mjs --check
          node scripts/qa-factory.mjs
          node scripts/qa-taxonomy.mjs
          node --check scripts/qa-growth-a4-a6.mjs
          node scripts/qa-growth-a4-a6.mjs
          node scripts/qa-approved-links-a4.mjs
          node --check scripts/qa-candidate-review-a6.mjs
          node scripts/qa-candidate-review-a6.mjs
          node scripts/smoke-factory.mjs
