name: Spanish Theme Branch QA
on:
  push:
    branches:
      - 'theme/spanish-premium-p0-20261014'
    paths:
      - 'THEME_UPGRADE_MATRIX.md'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'scripts/qa-theme.mjs'
      - '.github/workflows/theme-branch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and generated SEO pages (read-only)
        run: |
          node --check assets/js/app.js
          node --check scripts/qa-theme.mjs
          node --check scripts/build.mjs
          node scripts/build.mjs --check
          node scripts/qa-factory.mjs
          node scripts/qa-taxonomy.mjs
          node scripts/qa-growth-a4-a6.mjs
          node scripts/qa-candidate-review-a6.mjs
          node scripts/qa-approved-links-a4.mjs
          node scripts/qa-theme.mjs
          node scripts/smoke-factory.mjs
