name: Temporary taxonomy preview builder
on:
  push:
    branches: ['feat/spanish-taxonomy-a1-a3']
    paths:
      - 'scripts/**'
      - 'site/taxonomy.json'
      - 'data/editorial-plan.json'
      - '.github/workflows/taxonomy-preview.yml'
permissions:
  contents: write
concurrency:
  group: spanish-taxonomy-build
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate
        run: |
          node --check scripts/build.mjs
          node --check scripts/taxonomy.mjs
          node scripts/build.mjs
          node scripts/qa-factory.mjs
          node scripts/qa-taxonomy.mjs
          node scripts/seo-audit.mjs --mode=offline
          node scripts/build.mjs --check
      - name: Commit generated pages to preview branch only
        run: |
          set -euo pipefail
          git config user.name "spanish-taxonomy-ci"
          git config user.email "spanish-taxonomy-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "build(spanish): generate category navigation on 17 pages"
          git fetch origin feat/spanish-taxonomy-a1-a3
          if [ "$(git rev-parse origin/feat/spanish-taxonomy-a1-a3)" != "$(git rev-parse HEAD^)" ]; then echo "Branch advanced; stop" >&2; exit 1; fi
          git push origin HEAD:feat/spanish-taxonomy-a1-a3
